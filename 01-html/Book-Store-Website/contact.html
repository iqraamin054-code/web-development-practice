<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="icon" href="assets/favicon.png"type="image/png">
    <title>The Little Book Store</title>
</head>

<body>

    <header>

        <h1>Contact Us</h1>

        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/#about">About LBS</a></li>
                <li><a href="/#our-books">Our Books</a></li>
                <li><a href="hours.html" target="_blank">Store Hours</a></li>
            </ul>
        </nav>

        <figure>
            <img src="assets/library.jpg" alt="Illustration represent the beutiful represention of collections of books" title="Reading books" width="404" height="316">
            <figcaption>The Little Book Store Collection</figcaption>
        </figure>

    </header>

    <hr>

    <main>

        <article>
            <h2>Our Contact Form</h2>
            <p>
               Send Us A Message: 
            </p>

            <form action="https://httpbin.org/get" method="get">
                <fieldset>
                    <legend>Send Us A Message</legend>

                <p>
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" placeholder="Enter your name" required autofocus autocomplete="on">
                </p>
                <p>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Enter your Email" required autofocus autocomplete="on">
                </p>
               <p>
                    <label for="message">Your Message:</label><br>
                    <textarea name="message" id="message" cols="30" rows="10"
                    placeholder="Type your message here"></textarea>
                </p>

                </fieldset>

                <button type="submit">Send</button>
                <button type="reset">Reset</button>
               
            </form>

        </article>
        
         <section> 
        <h2>Our Location</h2>
        <address>
            555 Knowledge Lane, Suite T <br>
            Book City, NY 55555-5555 <br><br>
            Phone: <a href="tel:12345-67891">55555-55555</a>
        </address>
        </section> 

        <p>
            <a href="#">Back to Top</a>
        </p>

    </main>

    <hr>

    <footer>
        <p>Copyright &copy; The Little Book Store</p>
    </footer>
    
</body>
</html>
